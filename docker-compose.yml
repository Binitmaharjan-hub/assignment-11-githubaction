services:
  db:
    image: mysql:8.0
    environment: 
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: appdb
      MYSQL_USER: appuser
      MYSQL_PASSWORD: userpassword
    ports:
      - "3306:3306"
    volumes:
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql
      - mysql_data:/var/lib/mysql


  backend:
    build: ./backend
    ports:
      - "5001:5000"
    environment:
     DB_HOST: db
     DB_USER: appuser
     DB_PASSWORD: userpassword
     DB_NAME: appdb
    depends_on:
      - db
  
  web:
    build: ./frontend
    ports:
      - "9090:80"
    depends_on:
      - backend

volumes:
  mysql_data: